# =============================================================================
# Sakra Forms - Nginx Reverse Proxy Configuration
# =============================================================================
# Proxies requests to the FastAPI backend with gzip compression,
# proper header forwarding, and security settings.
#
# Usage:
#   Place this file at /etc/nginx/conf.d/sakra.conf or include it
#   in your main nginx.conf.
# =============================================================================

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # --- Client Settings ---
    client_max_body_size 10M;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Proxy to Backend ---
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Static files (if served by nginx) ---
    # location /static/ {
    #     alias /app/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}

