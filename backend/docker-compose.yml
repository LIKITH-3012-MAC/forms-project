# =============================================================================
# Sakra Forms - Docker Compose
# =============================================================================
# Orchestrates the backend API server and MySQL database for local
# development and production deployments.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down -v        # Stop and remove volumes
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI + Gunicorn + Uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build: .
    container_name: sakra-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sakra-network

  # ---------------------------------------------------------------------------
  # MySQL 8.0 Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: sakra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sakra_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakra_forms}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - sakra-network

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  sakra-network:
    driver: bridge
